name: crowdsecurity/appsec-hybrid
# Fail-closed default: anything not explicitly downgraded is hard-blocked.
default_remediation: ban
inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-*
outofband_rules:
  - crowdsecurity/experimental-*
  - crowdsecurity/appsec-generic-test
on_match:
  # Broad/generic attack signatures -> ask for a CAPTCHA instead of a hard block.
  # NOTE: "|" block scalars are required, otherwise YAML treats "#.name" as a comment.
  - filter: |
      any(evt.Appsec.MatchedRules, #.name startsWith "crowdsecurity/generic-")
    apply:
      - SetRemediation("captcha")
  # Known-CVE virtual patching takes priority over the generic rule above.
  - filter: |
      any(evt.Appsec.MatchedRules, #.name startsWith "crowdsecurity/vpatch-")
    apply:
      - SetRemediation("ban")

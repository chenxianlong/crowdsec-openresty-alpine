# HTTPS default server on port 443.
#
# Uses a SELF-SIGNED certificate so HTTPS works immediately on an internal /
# IP-only host. Browsers/clients will show a certificate warning until you
# replace it with a trusted certificate.
#
# To use a real Let's Encrypt certificate later (requires a public domain
# pointing at this server), run:
#   apk add --no-cache certbot certbot-nginx
#   certbot --nginx -d your.domain.com
# and certbot will manage these ssl_certificate paths for you.
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;

	ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

	root /var/lib/nginx/html;
	index index.html index.htm;

	charset utf-8;

	location / {
		try_files $uri $uri/ =404;
	}
}

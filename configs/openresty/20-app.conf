# Reverse proxy for the PM2-managed Node.js app on 127.0.0.1:3000.
# Serves HTTP (80) and HTTPS (443, self-signed cert) for the server IP/hostname.
#
# When you deploy a real app on a different port, just change the upstream below.

upstream nodeapp {
	server 127.0.0.1:3000;
	keepalive 32;
}

# Empty value for normal requests keeps upstream keep-alive working;
# 'upgrade' is used for WebSocket connections.
map $http_upgrade $app_connection_upgrade {
	default upgrade;
	''      '';
}

server {
	listen 80;
	listen [::]:80;
	server_name 10.20.207.6 127.0.0.1 localhost zilong-06-server;

	location / {
		proxy_pass http://nodeapp;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support (keepalive-safe map defined above).
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $app_connection_upgrade;

		proxy_connect_timeout 60s;
		proxy_send_timeout    300s;
		proxy_read_timeout    300s;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name 10.20.207.6 127.0.0.1 localhost zilong-06-server;

	ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
	ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

	location / {
		proxy_pass http://nodeapp;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $app_connection_upgrade;

		proxy_connect_timeout 60s;
		proxy_send_timeout    300s;
		proxy_read_timeout    300s;
	}
}

# Default site on port 80.
# Serves a static landing page from /var/lib/nginx/html and applies
# long-lived cache headers to common static asset types.
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/lib/nginx/html;
	index index.html index.htm;

	charset utf-8;

	location / {
		try_files $uri $uri/ =404;
	}

	# Long-term caching for fingerprinted static assets.
	location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|avif|svg|mp4|webm)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
		try_files $uri =404;
	}

	location = /404.html { internal; }
	location = /50x.html { internal; }
}
